[package]
name = "brutmaschine"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
hex = "0.4.3"
rand = "0.9"
rand_chacha = "0.9"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"

# Learner-mode tests run release-scale work (baseline tuning, final phase).
# Unoptimised builds are about 200x slower there (errata R1). Optimisation does
# not change float results; overflow checks and debug assertions stay on.
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "brut"
path = "src/main.rs"

[[bin]]
name = "brut-eval"
path = "src/bin/brut-eval.rs"

# Human-in-the-loop pull-request mutation of candidates (ADR 0004).
[[bin]]
name = "brut-propose"
path = "src/bin/brut-propose.rs"

[[bin]]
name = "brut-ingest"
path = "src/bin/brut-ingest.rs"
