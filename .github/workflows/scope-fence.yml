name: scope-fence

# Mutation pull requests (ADR 0004) come from a `mutate/` branch and may change files
# under candidates/ only. This job runs for those branches alone, so ordinary development
# pull requests are not affected. It enforces three gates: the scope fence (no file outside
# candidates/), the add-only fence (no file that the base branch holds is changed or
# removed) and candidate validity (parse, check, id matches file name).
#
# Trust: the checker (brut-ingest) is built from the BASE revision, never from the pull
# request's code, and the pull request's own files are read only as data (changed-path
# list and candidate JSON). No pull-request-controlled code is built or executed here, so
# a mutation cannot neuter its own checker or run a Cargo build script before the fence
# (ADR 0004). The one residual gap for a same-repo pull request is that it can still edit
# this workflow file itself; close that with a repository ruleset restricting `mutate/*`
# pushes to `candidates/**`, enforced server-side regardless of CI.
on:
  pull_request:

jobs:
  fence:
    if: startsWith(github.head_ref, 'mutate/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base revision (trusted)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Check out the pull request (data only)
        uses: actions/checkout@v4
        with:
          path: pr
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the checker from the base revision
        run: cargo build --quiet --manifest-path base/Cargo.toml --bin brut-ingest

      - name: Scope fence (candidates/ only)
        working-directory: pr
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --no-renames --name-only "origin/${{ github.base_ref }}...HEAD" \
            | ../base/target/debug/brut-ingest --scope-check

      # A candidate file is only ever added (scripts/propose-pr.sh). Its name is its content
      # id, which for a promoted model hashes the genome alone, so a change to a file that
      # the base branch holds could rewrite a pooled model's provenance unseen by the gates
      # below. The lower-case filter "a" lists every changed path except the added ones.
      - name: Add-only fence (no changed or removed files)
        working-directory: pr
        run: |
          changed="$(git diff --no-renames --diff-filter=a --name-only "origin/${{ github.base_ref }}...HEAD")"
          if [ -n "${changed}" ]; then
            echo "scope-fence: a mutation pull request may only add candidate files; it changes or removes:"
            echo "${changed}"
            exit 1
          fi
          echo "scope-fence: every changed path is an added file"

      - name: Validate candidates (as data)
        run: ./base/target/debug/brut-ingest --candidates pr/candidates

      - name: Validate Cascades (as data, ADR 0005)
        run: |
          if [ -d pr/candidates/cascades ]; then
            ./base/target/debug/brut-ingest --cascades pr/candidates/cascades
          fi

      - name: Validate promoted models (as data, ADR 0008)
        run: |
          if [ -d pr/candidates/models ]; then
            ./base/target/debug/brut-ingest --models pr/candidates/models
          fi
